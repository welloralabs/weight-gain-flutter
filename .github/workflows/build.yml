name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The android/ folder is generated here so the package name is exactly
      # app.web.wgcalc_hp_2610 (org "app.web" + project "wgcalc_hp_2610").
      - name: Generate Android project
        run: |
          flutter create --org app.web --project-name wgcalc_hp_2610 --platforms android --no-pub /tmp/gen
          rm -rf android
          cp -r /tmp/gen/android ./android
          sed -i 's/android:label="[^"]*"/android:label="Weight Gain Calculator"/' android/app/src/main/AndroidManifest.xml
          grep -rn "app.web.wgcalc_hp_2610" android/app/build.gradle* || true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (compares the Dart calculators with the web app)
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weight-gain-apk
          path: build/app/outputs/flutter-apk/app-release.apk
