name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub's web upload often drops folders and puts every file in the
      # repository root. This step puts each file back where Flutter expects it.
      - name: Restore folder structure
        run: |
          move() { if [ -f "$1" ] && [ ! -f "$2/$1" ]; then mkdir -p "$2"; mv "$1" "$2/$1"; echo "moved $1 -> $2/"; fi; }
          for f in main.dart theme.dart widgets.dart links.dart; do move "$f" lib; done
          for f in calc.dart format.dart; do move "$f" lib/logic; done
          for f in calculators.dart home.dart soon.dart tool.dart weight_gain.dart; do move "$f" lib/screens; done
          move calc_test.dart test
          echo "--- project tree"
          find lib test -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The android/ folder is generated here so the package name is exactly
      # app.web.wgcalc_hp_2610 (org "app.web" + project "wgcalc_hp_2610").
      - name: Generate Android project
        run: |
          flutter create --org app.web --project-name wgcalc_hp_2610 --platforms android --no-pub /tmp/gen
          rm -rf android
          cp -r /tmp/gen/android ./android
          sed -i 's/android:label="[^"]*"/android:label="Weight Gain Calculator"/' android/app/src/main/AndroidManifest.xml
          grep -rn "app.web.wgcalc_hp_2610" android/app/build.gradle* || true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (compares the Dart calculators with the web app)
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weight-gain-apk
          path: build/app/outputs/flutter-apk/app-release.apk
